<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Olympic Speed Quizz !</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body id="wrapper">
    <aside id="aside">
        <div>
            <h1>Olympic Speed Quiz</h1>
            <div id="scores-list"></div>
        </div>
        <div id="question-div">
            <p>Initialisation...</p>
            <button type="button">R1</button>
            <button type="button">R2</button>
            <button type="button">R3</button>
            <button type="button">R4</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button type="button" id="dice-roll">Lancer les dés</button>
            <button type="button" id="new-game">Nouvelle Partie</button>
        </div>
    </aside>
    <main id="main">
        <canvas id="canvas"></canvas>
    </main>
    <script src="./canvas.js"></script>
    <script src="./index.js"></script>
</body>

</html>
